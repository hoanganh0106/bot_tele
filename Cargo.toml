[package]
name = "bot_tele"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
authors = ["Admin <admin@localhost>"]
description = "High-concurrency, memory-safe Telegram Bot migrated from Python"

[dependencies]
# Async Runtime & Core Utilities
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Telegram Bot Framework
teloxide = { version = "0.13", features = ["macros"] }

# HTTP Webhook Server (SePay Integration)
axum = { version = "0.7", features = ["tokio", "http1", "json"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }

# HTTP Client for External APIs (Binance, Hypervin, CTV, Phone Rental)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
url = { version = "2.5", features = ["serde"] }

# Serialization & Deserialization (100% JSON Compatibility)
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Configuration & Environment
dotenvy = "0.15"

# High-Performance Concurrency & In-Memory Storage
parking_lot = { version = "0.12", features = ["serde"] }
dashmap = "6.0"

# Atomic File Persistence
tempfile = "3.10"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "chrono", "json"] }

# Strongly Typed Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Exact Financial Math (USDT & VND)
rust_decimal = { version = "1.35", features = ["serde-float", "maths"] }
rust_decimal_macros = "1.35"

# Time & Date Management
chrono = { version = "0.4", features = ["serde", "clock"] }

# Cryptography & Request Signing
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
md-5 = "0.10"

# Regex & Text Extraction (OTP & Phone Parsing)
regex = "1.10"

# Unique ID Generation
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
once_cell = "1.19"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
